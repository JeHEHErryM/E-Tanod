version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: e_tanod_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: e_tanod
    ports:
      - "5432:5432"
    volumes:
      - e_tanod_pgdata:/var/lib/postgresql/data

volumes:
  e_tanod_pgdata:
